name: Build Dropify APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'Release'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK
      run: |
        VERSION="${{ github.ref_name }}"
        if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
          cp build/app/outputs/flutter-apk/app-release.apk "Dropify-${VERSION}.apk"
        else
          cp build/app/outputs/flutter-apk/app-release.apk Dropify-debug-build.apk
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dropify-release-apk
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          Dropify-*.apk

    - name: Publish to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Dropify ${{ github.ref_name }}
        files: Dropify-${{ github.ref_name }}.apk
        fail_on_unmatched_files: false
