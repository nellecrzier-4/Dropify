name: dropify
description: A Pixeldrain Client.
publish_to: 'none'
version: 1.13.0+56

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  file_picker: ^8.1.2
  intl: ^0.20.3
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Linotte
      fonts:
        - asset: assets/fonts/Light.ttf
          weight: 300
        - asset: assets/fonts/Regular.ttf
          weight: 400
        - asset: assets/fonts/Medium.ttf
          weight: 500
        - asset: assets/fonts/Bold.ttf
          weight: 700
        - asset: assets/fonts/Black.ttf
          weight: 900
