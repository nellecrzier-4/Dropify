plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.nel.dropify"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Keystore ikut repo supaya APK dari CI maupun build lokal memakai tanda
    // tangan yang sama -> update bisa dipasang tanpa uninstall.
    signingConfigs {
        release {
            storeFile file("dropify-release.jks")
            storePassword "dropify123"
            keyAlias "dropify"
            keyPassword "dropify123"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.nel.dropify"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    // Lint tidak diperlukan untuk menghasilkan APK, dan detektornya crash pada
    // gabungan AGP 9 + JDK 17 (CommentDetector). Matikan supaya build stabil.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation("androidx.core:core:1.13.1")
}
